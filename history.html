<!DOCTYPE html>
<html lang="en">
<head>
  <script src="api-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History</title>

    <style>

        :root{
            --bg-color:#f8f7f2;
            --card-bg:#fffefb;
            --text-main:#2d3436;
            --accent-green:#96b3a2;
            --border-color:#e0e0e0;
            --shadow:0 4px 12px rgba(0,0,0,0.05);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,sans-serif;
        }

        body{
            background:var(--bg-color);
            color:var(--text-main);
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 40px;
            background:var(--card-bg);
            border-bottom:1px solid var(--border-color);
            box-shadow:var(--shadow);
        }

        .logo{
            font-size:24px;
            font-weight:bold;
            color:var(--accent-green);
        }

        nav a{
            margin:0 12px;
            text-decoration:none;
            color:var(--text-main);
            font-weight:500;
        }

        nav a.active{
            background:var(--accent-green);
            color:white;
            padding:8px 15px;
            border-radius:8px;
        }

        .container{
            max-width:1000px;
            margin:40px auto;
            padding:20px;
        }

        h1{
            color:var(--text-main);
            margin-bottom:20px;
        }

        .card{
            background:var(--card-bg);
            padding:20px;
            margin-top:20px;
            border-radius:15px;
            box-shadow:var(--shadow);
            border:1px solid var(--border-color);
        }

        p{
            margin:8px 0;
        }
.delete-btn{

    margin-top:15px;

    background:#dc2626;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

    transition:.3s;

}

.delete-btn:hover{

    background:#b91c1c;

}
    </style>
</head>

<body>

<header>

  <div class="logo">
    &#127807; MindWell
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="journal.html">Journal</a>
    <a href="resources.html">Resources</a>
    <a href="profile.html">Profile</a>
  </nav>

</header>

<main class="container">

    <h1>📊 Assessment History</h1>

    <div id="historyContainer"></div>

</main>

<script>

async function loadHistory(){

    const email =
        localStorage.getItem("userEmail");

    if(!email){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    const response =
        await fetch(
            "http://localhost:5000/assessment/" + email
        );

    const data =
        await response.json();

    const container =
        document.getElementById(
            "historyContainer"
        );

    container.innerHTML = "";

    if(data.length === 0){

        container.innerHTML =
            "<h2>No assessment history found.</h2>";

        return;
    }

    data.forEach(item => {

       container.innerHTML += `

<div class="card">

    <p><b>Date:</b>
    ${new Date(item.createdAt).toLocaleString()}</p>

    <p><b>Stress:</b> ${item.stress}</p>

    <p><b>Anxiety:</b> ${item.anxiety}</p>

    <p><b>Sleep:</b> ${item.sleep}</p>

    <p><b>Happiness:</b> ${item.happiness}</p>

    <p><b>Focus:</b> ${item.focus}</p>

    <p><b>Motivation:</b> ${item.motivation}</p>

    <button class="delete-btn"
        onclick="deleteAssessment('${item._id}')">

        Delete

    </button>

</div>

`;
    });
}

loadHistory();
async function deleteAssessment(id){

    const confirmDelete = confirm(
        "Are you sure you want to delete this assessment?"
    );

    if(!confirmDelete){

        return;

    }

    try{

        const response = await fetch(

            "http://localhost:5000/assessment/" + id,

            {

                method:"DELETE"

            }

        );

        const result = await response.json();

        alert(result.message);

        loadHistory();

    }

    catch(err){

        console.log(err);

        alert("Error deleting assessment");

    }

}
</script>

</body>
</html>
